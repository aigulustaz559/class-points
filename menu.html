
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Points — Табло класса</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #081426;
  --panel: #11233d;
  --blue: #3b82f6;
  --yellow: #ffd84d;
  --green: #43e08c;
  --white: #ffffff;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
}

body { padding: 24px; }

header {
  max-width: 1500px;
  margin: 0 auto 26px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.brand {
  font-size: clamp(28px, 3vw, 48px);
  font-weight: 900;
  letter-spacing: -1px;
}

.brand span { color: var(--yellow); }

.info {
  text-align: right;
  color: #b8c9e4;
  font-size: 14px;
}

#connection {
  color: var(--green);
  margin-top: 6px;
}

main {
  max-width: 1500px;
  margin: auto;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.student {
  min-width: 0;
  display: grid;
  grid-template-columns: 1fr 90px;
  align-items: stretch;
  gap: 10px;
  padding: 12px;
  border: 1px solid #2c4568;
  border-radius: 17px;
  background: var(--panel);
  box-shadow: 0 8px 22px #00000020;
}

.student-name {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #ffffff;
  color: #17243a;
  border-radius: 11px;
  padding: 12px;
  font-size: clamp(15px, 1.35vw, 22px);
  font-weight: 800;
  overflow-wrap: anywhere;
}

.number {
  color: #6b7c94;
  font-size: 13px;
  flex-shrink: 0;
}

.score {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 68px;
  border-radius: 11px;
  background: var(--yellow);
  color: #17243a;
  font-size: clamp(25px, 2.2vw, 36px);
  font-weight: 900;
}

.bulb {
  width: 30px;
  height: 30px;
  object-fit: contain;
  flex-shrink: 0;
}

.empty {
  grid-column: 1 / -1;
  padding: 50px 20px;
  border-radius: 16px;
  text-align: center;
  background: var(--panel);
  color: #c4d3e9;
  font-size: 20px;
}

footer {
  max-width: 1500px;
  margin: 24px auto 0;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  color: #9bb0cd;
  font-size: 13px;
}

@media (max-width: 950px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 580px) {
  body { padding: 12px; }
  header { align-items: flex-start; }
  .board { grid-template-columns: 1fr; }
  .student { grid-template-columns: 1fr 75px; }
}
</style>
</head>

<body>
<header>
  <div class="brand">CLASS <span>POINTS</span></div>
  <div class="info">
    <div>ТАБЛО БАЛЛОВ КЛАССА</div>
    <div id="connection">Подключение к Supabase…</div>
  </div>
</header>

<main>
  <div id="board" class="board">
    <div class="empty">Загружаем список учеников…</div>
  </div>
</main>

<footer>
  <span>Баллы класса в реальном времени</span>
  <span>Автообновление каждые 2 секунды</span>
</footer>

<script>
"use strict";

// Настройки Supabase — из рабочего ученического портала.
const SUPABASE_URL =
  "https://izbxumimzerxasevkkgy.supabase.co";

// Вставь сюда Publishable key из Supabase → Settings → API Keys.
const SUPABASE_KEY =
  "ВСТАВЬ_СЮДА_СВОЙ_РАБОЧИЙ_sb_publishable_КЛЮЧ";

const FUNCTION_URL =
  `${SUPABASE_URL}/functions/v1/class-points`;

// Настоящее изображение лампочки, не emoji.
const BULB_IMAGE =
  "https://upload.wikimedia.org/wikipedia/commons/0/06/Light_bulb.png";

const board = document.getElementById("board");
const connection = document.getElementById("connection");

let isLoading = false;
let lastData = "";

function setConnection(message, isError = false) {
  connection.textContent = message;
  connection.style.color = isError ? "#ff8c8c" : "#43e08c";
}

async function fetchStudents() {
  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify({ action: "students" })
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      result.message ||
      result.error ||
      `HTTP ${response.status}`
    );
  }

  if (!Array.isArray(result.students)) {
    throw new Error("В ответе сервера нет массива students.");
  }

  return result.students;
}

function getName(student) {
  return student.full_name ??
         student.name ??
         student.student_name ??
         "Без имени";
}

function getPoints(student) {
  const value = student.points ??
                student.total_points ??
                student.score ??
                0;

  const number = Number(value);
  return Number.isFinite(number) ? number : 0;
}

function renderBoard(students) {
  if (students.length === 0) {
    board.innerHTML =
      '<div class="empty">Список учеников пока пуст.</div>';
    return;
  }

  const sorted = [...students].sort((a, b) =>
    getName(a).localeCompare(getName(b), "ru")
  );

  // Создаём строку данных для проверки изменений.
  const snapshot = JSON.stringify(
    sorted.map(student => ({
      id: student.id,
      name: getName(student),
      points: getPoints(student)
    }))
  );

  // Не перерисовываем табло, если данные не изменились.
  if (snapshot === lastData) return;
  lastData = snapshot;

  const fragment = document.createDocumentFragment();

  sorted.forEach((student, index) => {
    const card = document.createElement("article");
    card.className = "student";

    const nameBox = document.createElement("div");
    nameBox.className = "student-name";

    const bulb = document.createElement("img");
    bulb.className = "bulb";
    bulb.src = BULB_IMAGE;
    bulb.alt = "";
    bulb.loading = "lazy";
    bulb.onerror = () => {
      bulb.style.display = "none";
    };

    const number = document.createElement("span");
    number.className = "number";
    number.textContent = String(index + 1).padStart(2, "0");

    const name = document.createElement("span");
    name.textContent = getName(student);

    nameBox.append(bulb, number, name);

    const score = document.createElement("div");
    score.className = "score";
    score.textContent = getPoints(student);

    card.append(nameBox, score);
    fragment.append(card);
  });

  board.replaceChildren(fragment);
}

async function updateBoard() {
  if (isLoading) return;
  isLoading = true;

  try {
    const students = await fetchStudents();
    renderBoard(students);

    const time = new Date().toLocaleTimeString("ru-RU");
    setConnection(`Подключено · обновлено ${time}`);
  } catch (error) {
    console.error("Ошибка табло:", error);

    setConnection(
      `Ошибка: ${error.message}`,
      true
    );

    // Оставляем последние успешно загруженные данные на экране.
  } finally {
    isLoading = false;
  }
}

// Первая загрузка и последующее обновление каждые 2 секунды.
updateBoard();
setInterval(updateBoard, 2000);
</script>
</body>
</html>
