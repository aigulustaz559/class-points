
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081426">
<title>Class Points — Табло класса</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #081426;
  --panel: #11233d;
  --yellow: #ffd84d;
  --white: #ffffff;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: clamp(8px, 1.2vw, 18px);
  display: flex;
  flex-direction: column;
}

header {
  width: 100%;
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-bottom: clamp(8px, 1vh, 14px);
}

.brand {
  font-size: clamp(22px, 2.5vw, 40px);
  font-weight: 900;
  white-space: nowrap;
}

.brand span { color: var(--yellow); }

.info {
  text-align: right;
  color: #bdcbe0;
  font-size: clamp(10px, .9vw, 14px);
}

#connection {
  margin-top: 4px;
  color: #43e08c;
}

main {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
}
  
.board {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr));
  gap: clamp(5px, .7vw, 10px);

  background-image: url("back.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.student {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(42px, 5.2vw, 76px);
  gap: clamp(4px, .5vw, 8px);
  padding: clamp(4px, .6vw, 9px);
  background: var(--panel);
  border: 1px solid #2b4263;
  border-radius: clamp(7px, .8vw, 13px);
}

.student-name {
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  gap: clamp(4px, .5vw, 8px);
  padding: clamp(5px, .65vw, 10px);
  border-radius: 7px;
  background: #fff;
  color: #17243a;
  font-size: clamp(11px, 1.15vw, 19px);
  font-weight: 800;
  line-height: 1.12;
  overflow-wrap: anywhere;
  overflow: hidden;
}

.bulb {
  width: clamp(17px, 2vw, 29px);
  height: clamp(17px, 2vw, 29px);
  object-fit: contain;
  flex: 0 0 auto;
}

.student-number {
  color: #77869b;
  font-size: clamp(9px, .7vw, 12px);
  flex: 0 0 auto;
}

.score {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 0;
  min-height: 0;
  border-radius: 7px;
  background: var(--yellow);
  color: #17243a;
  font-size: clamp(19px, 2.2vw, 34px);
  font-weight: 900;
}

.empty {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border-radius: 12px;
  color: #d1dced;
  text-align: center;
  padding: 20px;
}

footer {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding-top: clamp(6px, .8vh, 12px);
  color: #9eb0cb;
  font-size: clamp(9px, .75vw, 12px);
}

@media (max-width: 700px) {
  .board {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 420px) {
  body { padding: 7px; }
  .board { grid-template-columns: 1fr; }
  .student { grid-template-columns: minmax(0, 1fr) 48px; }
}
</style>
</head>

<body>
<header>
  <div class="brand">CLASS <span>POINTS</span></div>
  <div class="info">
    <div>ТАБЛО БАЛЛОВ КЛАССА</div>
    <div id="connection">Подключение…</div>
  </div>
</header>

<main>
  <div id="board" class="board">
    <div class="empty">Загружаем учеников…</div>
  </div>
</main>

<footer>
  <span>Баллы класса</span>
  <span>Обновление каждые 2 секунды</span>
</footer>

<script>
"use strict";

const SUPABASE_URL =
  "https://izbxumimzerxasevkkgy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_pVuFu_Hkeq07SDirDNJoGw_UcjhYCNj";

const FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/class-points";

const BULB_IMAGE =
  "balm.png";

const board = document.getElementById("board");
const connection = document.getElementById("connection");

let loading = false;
let previousSnapshot = "";

function setStatus(message, error = false) {
  connection.textContent = message;
  connection.style.color = error ? "#ff8b8b" : "#43e08c";
}

async function fetchStudents() {
  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify({ action: "students" })
  });

  const text = await response.text();
  let result;

  try {
    result = JSON.parse(text);
  } catch {
    throw new Error("Сервер вернул не JSON: " + text.slice(0, 200));
  }

  if (!response.ok) {
    throw new Error(
      result.message || result.error || "HTTP " + response.status
    );
  }

  if (!Array.isArray(result.students)) {
    throw new Error("В ответе отсутствует массив students");
  }

  return result.students;
}

function renderStudents(students) {
  const sorted = [...students].sort((a, b) =>
    String(a.full_name || "").localeCompare(
      String(b.full_name || ""), "ru"
    )
  );

  const snapshot = JSON.stringify(
    sorted.map(s => ({
      id: s.id,
      name: s.full_name,
      points: s.points
    }))
  );

  if (snapshot === previousSnapshot) return;
  previousSnapshot = snapshot;

  if (sorted.length === 0) {
    board.style.setProperty("--rows", "1");
    board.innerHTML =
      '<div class="empty">Активные ученики не найдены.</div>';
    return;
  }

  // На широком экране три колонки; число строк рассчитывается автоматически.
  const columns = window.innerWidth <= 420 ? 1
                : window.innerWidth <= 700 ? 2 : 3;
  const rows = Math.ceil(sorted.length / columns);
  board.style.setProperty("--rows", String(rows));

  const fragment = document.createDocumentFragment();

  sorted.forEach((student, index) => {
    const card = document.createElement("article");
    card.className = "student";

    const nameBox = document.createElement("div");
    nameBox.className = "student-name";

    const bulb = document.createElement("img");
    bulb.className = "bulb";
    bulb.src = BULB_IMAGE;
    bulb.alt = "";
    bulb.onerror = () => bulb.remove();

    const number = document.createElement("span");
    number.className = "student-number";
    number.textContent = String(index + 1).padStart(2, "0");

    const name = document.createElement("span");
    name.textContent = student.full_name || "Без имени";

    nameBox.append(bulb, number, name);

    const score = document.createElement("div");
    score.className = "score";

    const points = Number(student.points);
    score.textContent =
      student.points !== null &&
      student.points !== undefined &&
      Number.isFinite(points)
        ? String(points)
        : "—";

    card.append(nameBox, score);
    fragment.append(card);
  });

  board.replaceChildren(fragment);
}

async function updateBoard() {
  if (loading) return;
  loading = true;

  try {
    const students = await fetchStudents();
    console.log("Данные учеников:", students);
    renderStudents(students);

    setStatus("Обновлено: " +
      new Date().toLocaleTimeString("ru-RU"));
  } catch (error) {
    console.error("Ошибка табло:", error);
    setStatus("Ошибка: " + error.message, true);
  } finally {
    loading = false;
  }
}

window.addEventListener("resize", () => {
  previousSnapshot = "";
  updateBoard();
});

updateBoard();
setInterval(updateBoard, 2000);
</script>
</body>
</html>
