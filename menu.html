
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табло класса</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  font-family: Georgia, "Times New Roman", serif;
}

#board {
  width: 100vw;
  height: 100vh;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 3vw;
}

.column {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 8px;
  min-width: 0;
}

.student {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 4.5vw 3.5vw;
  align-items: center;
  gap: 1vw;
}

.name {
  background: #fff;
  border: 2px solid #75b94c;
  border-radius: 10px;
  padding: 8px 3px;
  text-align: center;
  font-size: clamp(14px, 2vw, 34px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.points {
  background: #ffc400;
  border: 2px solid #d6a300;
  text-align: center;
  font-size: clamp(18px, 2.5vw, 42px);
  padding: 5px 0;
}

.bulb {
  width: 100%;
  max-width: 65px;
  height: auto;
  object-fit: contain;
}

#status {
  position: fixed;
  right: 8px;
  bottom: 3px;
  color: #888;
  font: 11px Arial, sans-serif;
}

@media (max-width: 700px) {
  #board {
    height: auto;
    min-height: 100vh;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .student {
    grid-template-columns: minmax(0, 1fr) 42px 30px;
    gap: 5px;
  }

  .name { font-size: 14px; }
  .points { font-size: 20px; }
}
</style>
</head>

<body>
<div id="board">Загрузка…</div>
<div id="status">Подключение…</div>

<script>
const SUPABASE_URL =
  "https://izbxumimzerxasevkkgy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_pVuFu_Hkeq07SDirDNJoGw_UcjhYCNj";

const API = SUPABASE_URL + "/functions/v1/class-points";

// Реальное изображение PNG, не эмодзи:
const BULB =
  "https://upload.wikimedia.org/wikipedia/commons/0/06/Light_bulb.png";

const board = document.getElementById("board");
const statusEl = document.getElementById("status");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function getName(s) {
  return s.full_name ?? s.name ?? s.student_name ?? "Ученик";
}

function getPoints(s) {
  return s.points ?? s.total_points ?? s.score ?? 0;
}

function render(students) {
  students.sort((a, b) =>
    Number(a.number ?? a.student_number ?? 9999) -
    Number(b.number ?? b.student_number ?? 9999)
  );

  const size = Math.ceil(students.length / 3);

  const columns = [
    students.slice(0, size),
    students.slice(size, size * 2),
    students.slice(size * 2)
  ];

  board.innerHTML = columns.map((list, col) => `
    <div class="column">
      ${list.map((s, i) => {
        const num =
          s.number ?? s.student_number ?? (col * size + i + 1);

        return `
          <div class="student">
            <div class="name">
              ${esc(num)}. ${esc(getName(s))}
            </div>

            <div class="points">${esc(getPoints(s))}</div>

            <img
              class="bulb"
              src="${BULB}"
              alt="Лампочка"
            >
          </div>
        `;
      }).join("")}
    </div>
  `).join("");
}

let busy = false;

async function updateBoard() {
  if (busy) return;
  busy = true;

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify({ action: "students" })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "HTTP " + response.status);
    }

    const students = Array.isArray(data)
      ? data
      : data.students ?? data.data;

    if (!Array.isArray(students)) {
      throw new Error("Проверь формат ответа class-points");
    }

    render(students);

    statusEl.textContent =
      "Обновлено: " + new Date().toLocaleTimeString("ru-RU");

  } catch (error) {
    statusEl.textContent = "Ошибка: " + error.message;
    console.error(error);
  } finally {
    busy = false;
  }
}

updateBoard();
setInterval(updateBoard, 2000);
</script>
</body>
</html>
